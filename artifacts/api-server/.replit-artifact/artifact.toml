kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/authorize", "/token", "/register", "/.well-known", "/robots.txt", "/sitemap.xml", "/rodada", "/jogador", "/assets"]

[services.development]
run = { args = ["pnpm", "--filter", "@workspace/api-server", "run", "dev"], env = { ENABLE_IN_PROCESS_CRON = "true" } }

[services.production]
build = "pnpm --filter @workspace/api-server run build"

[services.production.run]
args = ["node", "artifacts/api-server/dist/index.cjs"]

[services.production.run.env]
PORT = "8080"
FRONTEND_DIST_PATH = "artifacts/cartola-intel/dist/public"
ENABLE_IN_PROCESS_CRON = "false"

[services.production.health.startup]
path = "/api/healthz"
