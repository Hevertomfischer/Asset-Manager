kind = "web"
previewPath = "/"
title = "Cartola Intel"
version = "1.0.0"
id = "artifacts/cartola-intel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18447
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cartola-intel run dev"

[services.env]
PORT = "18447"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cartola-intel", "run", "build"]
publicDir = "artifacts/cartola-intel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
