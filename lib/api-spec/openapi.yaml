openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cartola Intel API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: round
    description: Round and market operations
  - name: players
    description: Player operations
  - name: matches
    description: Match operations
  - name: availability
    description: Player availability
  - name: lineup
    description: Lineup generation
  - name: admin
    description: Admin operations
paths:
  /billing/config:
    get:
      operationId: getBillingConfig
      tags: [billing]
      summary: Current public prices and season validity
      responses:
        "200":
          description: Effective checkout prices, including any active founder discount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfiguration"
        "500":
          description: Configuration unavailable
  /admin/config:
    get:
      operationId: getAdminConfiguration
      tags: [admin]
      responses:
        "200":
          description: Administrative configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfiguration"
        "401":
          description: Authentication required
        "403":
          description: Administrator required
    post:
      operationId: updateAdminConfiguration
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConfigurationPatch"
      responses:
        "200":
          description: Updated administrative configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfiguration"
        "400":
          description: Invalid configuration
        "401":
          description: Authentication required
        "403":
          description: Administrator required
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [health]
      summary: Public synchronization health without private provider logs
      responses:
        "200":
          description: Public status summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
        "500":
          description: Status unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /round/current:
    get:
      operationId: getCurrentRound
      tags: [round]
      summary: Get current round info
      responses:
        "200":
          description: Current round info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundStatus"

  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: List players with projections and availability
      parameters:
        - name: position
          in: query
          schema:
            type: string
        - name: clubId
          in: query
          schema:
            type: integer
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: probableOnly
          in: query
          schema:
            type: string
        - name: minProjection
          in: query
          schema:
            type: number
        - name: maxMinimo
          in: query
          description: Maximum minimum score needed to increase price.
          schema:
            type: number
        - name: minBaseAverage
          in: query
          description: Minimum position-scout baseline average.
          schema:
            type: number
        - name: round
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerListResponse"

  /players/projections/current:
    get:
      operationId: getCurrentProjections
      tags: [players]
      summary: Get current round projections for all players
      parameters:
        - name: round
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Player projections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionListResponse"

  /players/{id}:
    get:
      operationId: getPlayerById
      tags: [players]
      summary: Get player details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
        "404":
          description: Not found

  /matches/current:
    get:
      operationId: getCurrentMatches
      tags: [matches]
      summary: Get current round matches
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"

  /availability/current:
    get:
      operationId: getCurrentAvailability
      tags: [availability]
      summary: Get current player availability
      parameters:
        - name: round
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Availability list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /lineup/generate:
    post:
      operationId: generateLineup
      tags: [lineup]
      summary: Generate a lineup suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupGenerateRequest"
      responses:
        "200":
          description: Generated lineup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupGenerateResponse"
        "402":
          description: Free-plan lock/exclusion or strategy limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequiredError"
        "422":
          description: Locked/excluded lineup is not feasible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupValidationError"
        "500":
          description: Generation failed

  /lineup/compare-formations:
    post:
      operationId: compareFormations
      tags: [lineup]
      summary: Compare all formations without saving or consuming generation quota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupGenerateRequest"
      responses:
        "200":
          description: Ranked suggestions with per-formation infeasibility reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormationComparison"
        "400":
          description: Invalid input
        "402":
          description: Strategy or constraint limit requires Pro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequiredError"
        "422":
          description: Conflicting constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupValidationError"
        "500":
          description: Operational failure

  /admin/sync/full:
    post:
      operationId: syncFull
      tags: [admin]
      summary: Trigger full ETL sync (all providers)
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          description: Sync already in progress

  /admin/sync/market:
    post:
      operationId: syncMarket
      tags: [admin]
      summary: Trigger market-only ETL sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          description: Sync already in progress

  /admin/sync/current-round:
    post:
      operationId: syncCurrentRound
      tags: [admin]
      summary: Trigger ETL sync for current round
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          description: Sync already in progress

  /admin/recalculate-projections:
    post:
      operationId: recalculateProjections
      tags: [admin]
      summary: Recalculate projections for current round
      responses:
        "200":
          description: Recalculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcResult"

  /admin/providers/status:
    get:
      operationId: getProvidersStatus
      tags: [admin]
      summary: Get status of all data providers
      responses:
        "200":
          description: Provider statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersStatusResponse"

  /admin/logs:
    get:
      operationId: getAdminLogs
      tags: [admin]
      summary: Get recent data collection logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Logs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogsResponse"

  /admin/projection-weights:
    get:
      operationId: getProjectionWeights
      tags: [admin]
      summary: Get current projection engine weights
      responses:
        "200":
          description: Projection weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionWeightsResponse"
    post:
      operationId: updateProjectionWeights
      tags: [admin]
      summary: Update projection engine weights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectionWeightsRequest"
      responses:
        "200":
          description: Updated weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionWeightsResponse"

  /lineup/{id}/save:
    post:
      operationId: saveLineup
      tags: [lineup]
      summary: Mark a lineup suggestion as saved/favourite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  schemas:
    PlanSettings:
      type: object
      required: [seasonPassYear, seasonPassEndsAt, proMonthlyPrice, seasonPassPrice]
      properties:
        seasonPassYear:
          type: integer
          minimum: 2020
          maximum: 2100
        seasonPassEndsAt:
          type: string
          format: date-time
        proMonthlyPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        seasonPassPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        founderSeasonPassPrice:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
    BillingConfiguration:
      allOf:
        - $ref: "#/components/schemas/PlanSettings"
        - type: object
          required: [regularSeasonPassPrice, founderCutoff]
          properties:
            regularSeasonPassPrice:
              type: number
            founderCutoff:
              type: string
              format: date-time
    AdminConfiguration:
      allOf:
        - $ref: "#/components/schemas/PlanSettings"
        - type: object
          required: [xgStaleDays]
          properties:
            xgStaleDays:
              type: integer
              minimum: 1
              maximum: 30
    AdminConfigurationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        xgStaleDays:
          type: integer
          minimum: 1
          maximum: 30
        seasonPassYear:
          type: integer
          minimum: 2020
          maximum: 2100
        seasonPassEndsAt:
          type: string
          format: date-time
        proMonthlyPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        seasonPassPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        founderSeasonPassPrice:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
    SyncStatus:
      type: object
      required: [lastSyncAt, isRunning, marketStatus, providersDegraded, lastMarketCheckAt]
      properties:
        lastSyncAt:
          type: [string, "null"]
        isRunning:
          type: boolean
        marketStatus:
          type: [string, "null"]
        providersDegraded:
          type: boolean
        lastMarketCheckAt:
          type: [string, "null"]
          description: Last successful market check; null before the first observation
    FormationEvaluation:
      type: object
      required: [formation, feasible, expectedPoints, totalCost, balance, differenceFromBest, reason]
      properties:
        formation:
          type: string
        feasible:
          type: boolean
        expectedPoints:
          type: [number, "null"]
        totalCost:
          type: [number, "null"]
        balance:
          type: [number, "null"]
        differenceFromBest:
          type: [number, "null"]
        reason:
          type: [string, "null"]
    FormationComparison:
      type: object
      required: [round, strategy, budget, bestFormation, results]
      properties:
        round:
          type: integer
        strategy:
          type: string
        budget:
          type: number
        bestFormation:
          type: [string, "null"]
        results:
          type: array
          items:
            $ref: "#/components/schemas/FormationEvaluation"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RoundStatus:
      type: object
      properties:
        round:
          type: integer
        marketStatus:
          type: integer
        marketOpen:
          type: boolean
        closingTimestamp:
          type: integer
          nullable: true
        closingDate:
          type: string
          nullable: true
        timesEscalados:
          type: integer
        warning:
          type: string
      required:
        - round
        - marketStatus
        - marketOpen

    Club:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        abbreviation:
          type: string
          nullable: true
        badgeUrl:
          type: string
          nullable: true

    PlayerProjectionSummary:
      type: object
      properties:
        expectedPoints:
          type: number
          nullable: true
        floorPoints:
          type: number
          nullable: true
        ceilingPoints:
          type: number
          nullable: true
        riskScore:
          type: number
          nullable: true
        recommendationScore:
          type: number
          nullable: true
        valueScore:
          type: number
          nullable: true
        explanationJson:
          type: object
          nullable: true

    PlayerAvailabilitySummary:
      type: object
      properties:
        playProbability:
          type: number
          nullable: true
        expectedMinutes:
          type: number
          nullable: true
        riskScore:
          type: number
          nullable: true
        probableStatus:
          type: string
          nullable: true
        injuryStatus:
          type: string
          nullable: true
        suspensionStatus:
          type: string
          nullable: true

    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nickname:
          type: string
          nullable: true
        position:
          type: string
        status:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        averagePoints:
          type: number
          nullable: true
        priceVariation:
          type: number
          nullable: true
          description: Price change from last round (variacao_num). Positive = player performed well.
        playedLastRound:
          type: boolean
          nullable: true
          description: Whether the player actually entered the field last round (entrou_em_campo).
        gamesPlayed:
          type: integer
          nullable: true
          description: Number of games played this season (jogos_num). Used for confidence scaling.
        minimoParaValorizar:
          type: number
          nullable: true
          description: Minimum points needed to increase price next round (minimo_para_valorizar from Cartola API).
        baseAverage:
          type: number
          nullable: true
          description: Average points excluding goal-event contributions (G×8, A×5, SG×5). Represents position-scout baseline.
        club:
          $ref: "#/components/schemas/Club"
          nullable: true
        projection:
          $ref: "#/components/schemas/PlayerProjectionSummary"
        availability:
          $ref: "#/components/schemas/PlayerAvailabilitySummary"
      required:
        - id
        - name
        - position

    PlayerListResponse:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        total:
          type: integer
      required:
        - players
        - total

    PlayerDetail:
      allOf:
        - $ref: "#/components/schemas/Player"
        - type: object
          properties:
            projections:
              type: array
              items:
                type: object

    ProjectionItem:
      type: object
      properties:
        id:
          type: integer
        playerId:
          type: integer
        round:
          type: integer
        expectedPoints:
          type: number
          nullable: true
        floorPoints:
          type: number
          nullable: true
        ceilingPoints:
          type: number
          nullable: true
        riskScore:
          type: number
          nullable: true
        recommendationScore:
          type: number
          nullable: true
        valueScore:
          type: number
          nullable: true
        player:
          type: object
          nullable: true

    ProjectionListResponse:
      type: object
      properties:
        projections:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionItem"
        round:
          type: integer
      required:
        - projections
        - round

    Match:
      type: object
      properties:
        id:
          type: integer
        round:
          type: integer
        homeClub:
          $ref: "#/components/schemas/Club"
          nullable: true
        awayClub:
          $ref: "#/components/schemas/Club"
          nullable: true
        matchDate:
          type: string
          nullable: true
        stadium:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    MatchListResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        round:
          type: integer
      required:
        - matches
        - round

    AvailabilityItem:
      type: object
      properties:
        id:
          type: integer
        playerId:
          type: integer
        round:
          type: integer
        playProbability:
          type: number
          nullable: true
        expectedMinutes:
          type: number
          nullable: true
        probableStatus:
          type: string
          nullable: true
        injuryStatus:
          type: string
          nullable: true
        suspensionStatus:
          type: string
          nullable: true
        player:
          type: object
          nullable: true

    AvailabilityListResponse:
      type: object
      properties:
        availability:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityItem"
        round:
          type: integer
      required:
        - availability
        - round

    LineupGenerateRequest:
      type: object
      properties:
        budget:
          type: number
        formation:
          type: string
          enum: ["3-4-3", "3-5-2", "4-3-3", "4-4-2", "4-5-1", "5-3-2", "5-4-1"]
        strategy:
          type: string
          enum: [safe, aggressive, cost-benefit, antimassa, valorizacao]
        round:
          type: integer
        lockedPlayerIds:
          type: array
          description: Jogadores que devem obrigatoriamente ser escalados.
          items:
            type: integer
        excludedPlayerIds:
          type: array
          description: Jogadores que não podem ser escalados.
          items:
            type: integer
      required:
        - strategy

    LineupPlayer:
      type: object
      properties:
        playerId:
          type: integer
        position:
          type: string
        slot:
          type: string
        orderIndex:
          type: integer
        isCaptain:
          type: boolean
        name:
          type: string
        nickname:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        averagePoints:
          type: number
          nullable: true
        gamesPlayed:
          type: integer
          nullable: true
        expectedPoints:
          type: number
          nullable: true
        floorPoints:
          type: number
          nullable: true
        ceilingPoints:
          type: number
          nullable: true
        riskScore:
          type: number
          nullable: true
        recommendationScore:
          type: number
          nullable: true
        explanation:
          type: object
          nullable: true
        clubId:
          type: integer
          nullable: true
        clubAbbr:
          type: string
          nullable: true
        clubName:
          type: string
          nullable: true
        minimoParaValorizar:
          type: number
          nullable: true
          description: Minimum points needed to increase price next round.
        valorizacaoMargin:
          type: number
          nullable: true
          description: Expected points minus minimum points needed to increase price.

    LineupReservePlayer:
      type: object
      properties:
        playerId:
          type: integer
        position:
          type: string
        isLuxuryReserve:
          type: boolean
        expectedPoints:
          type: number
          nullable: true
        floorPoints:
          type: number
          nullable: true
        ceilingPoints:
          type: number
          nullable: true
        price:
          type: number
          nullable: true
        orderIndex:
          type: integer
        name:
          type: string
        nickname:
          type: string
          nullable: true
        clubId:
          type: integer
          nullable: true
        clubAbbr:
          type: string
          nullable: true
        clubName:
          type: string
          nullable: true

    LineupSuggestion:
      type: object
      properties:
        id:
          type: integer
        round:
          type: integer
        strategyType:
          type: string
        formation:
          type: string
        budgetLimit:
          type: number
        totalCost:
          type: number
        expectedPoints:
          type: number
        riskScore:
          type: number
        captainPlayerId:
          type: integer
          nullable: true
        coachPlayerId:
          type: integer
          nullable: true
        players:
          type: array
          items:
            $ref: "#/components/schemas/LineupPlayer"
        reserves:
          type: array
          items:
            $ref: "#/components/schemas/LineupReservePlayer"

    LineupGenerateResponse:
      type: object
      properties:
        lineup:
          $ref: "#/components/schemas/LineupSuggestion"
      required:
        - lineup

    UpgradeRequiredError:
      type: object
      properties:
        error:
          type: string
        upgradeRequired:
          type: boolean
      required:
        - error
        - upgradeRequired

    LineupValidationError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SyncResult:
      type: object
      properties:
        success:
          type: boolean
        round:
          type: integer
        clubsUpserted:
          type: integer
        playersUpserted:
          type: integer
        availabilityProcessed:
          type: boolean
        projectionsGenerated:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        xgMatchesUpdated:
          type: integer
          nullable: true
        xgClubsMapped:
          type: integer
          nullable: true
        xgDegraded:
          type: boolean
          nullable: true
      required:
        - success
        - round

    RecalcResult:
      type: object
      properties:
        success:
          type: boolean
        round:
          type: integer
        message:
          type: string
      required:
        - success
        - round

    AdminLog:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
        entityType:
          type: string
          nullable: true
        status:
          type: string
        message:
          type: string
          nullable: true
        round:
          type: integer
          nullable: true
        collectedAt:
          type: string
        createdAt:
          type: string

    AdminLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AdminLog"
        total:
          type: integer
      required:
        - logs
        - total

    ProjectionWeightsResponse:
      type: object
      properties:
        weights:
          type: object
          additionalProperties:
            type: number
      required:
        - weights

    ProjectionWeightsRequest:
      type: object
      additionalProperties:
        type: number

    ProviderLog:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
          nullable: true
        entityType:
          type: string
        collectedAt:
          type: string

    ProviderStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
        lastCollectedAt:
          type: string
          nullable: true
        lastMessage:
          type: string
          nullable: true
        clubsMapped:
          type: integer
          nullable: true
        recentErrorCount:
          type: integer
        recentLogs:
          type: array
          items:
            $ref: "#/components/schemas/ProviderLog"
      required:
        - source
        - status

    ProvidersStatusResponse:
      type: object
