openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cartola Intel API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: round
    description: Round and market operations
  - name: players
    description: Player operations
  - name: matches
    description: Match operations
  - name: availability
    description: Player availability
  - name: lineup
    description: Lineup generation
  - name: admin
    description: Admin operations
paths:
  /stats/performance:
    get:
      operationId: getPerformanceStats
      tags: [stats]
      summary: Frozen-projection performance, with explicitly separated legacy data
      responses:
        "200":
          description: Trusted metrics and legacy metrics never aggregated together
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceStats"
        "500":
          description: Performance unavailable
  /admin/sync/closed-rounds:
    get:
      operationId: getHistoricalRepairProgress
      tags: [admin]
      summary: Admin-only progress of the official historical repair
      responses:
        "200":
          description: Current or most recent repair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalRepairStatus"
        "401":
          description: Authentication required
        "403":
          description: Administrator required
    post:
      operationId: startHistoricalRepair
      tags: [admin]
      summary: Force all closed rounds, consolidate scouts and calibrate after success
      responses:
        "202":
          description: Repair started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalRepairStatus"
        "401":
          description: Authentication required
        "403":
          description: Administrator required
        "409":
          description: Synchronization already running
        "502":
          description: Official market status unavailable
  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [billing]
      summary: Current real subscription and its recorded period
      responses:
        "200":
          description: Subscription, excluding promotional access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSubscription"
        "401":
          description: Authentication required
        "500":
          description: Subscription unavailable
  /billing/config:
    get:
      operationId: getBillingConfig
      tags: [billing]
      summary: Current public prices and season validity
      responses:
        "200":
          description: Effective checkout prices, including any active founder discount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfiguration"
        "500":
          description: Configuration unavailable
  /admin/config:
    get:
      operationId: getAdminConfiguration
      tags: [admin]
      responses:
        "200":
          description: Administrative configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfiguration"
        "401":
          description: Authentication required
        "403":
          description: Administrator required
    post:
      operationId: updateAdminConfiguration
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConfigurationPatch"
      responses:
        "200":
          description: Updated administrative configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfiguration"
        "400":
          description: Invalid configuration
        "401":
          description: Authentication required
        "403":
          description: Administrator required
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [health]
      summary: Public synchronization health without private provider logs
      responses:
        "200":
          description: Public status summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
        "500":
          description: Status unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /round/current:
    get:
      operationId: getCurrentRound
      tags: [round]
      summary: Get current round info
      responses:
        "200":
          description: Current round info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundStatus"

  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: List players with projections and availability
      parameters:
        - name: position
          in: query
          schema:
            type: string
        - name: clubId
          in: query
          schema:
            type: integer
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: probableOnly
          in: query
          schema:
            type: string
        - name: minProjection
          in: query
          schema:
            type: number
        - name: maxMinimo
          in: query
          description: Maximum minimum score needed to increase price.
          schema:
            type: number
        - name: minBaseAverage
          in: query
          description: Minimum position-scout baseline average.
          schema:
            type: number
        - name: round
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerListResponse"

  /players/projections/current:
    get:
      operationId: getCurrentProjections
      tags: [players]
      summary: Get current round projections for all players
      parameters:
        - name: round
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Player projections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionListResponse"

  /players/{id}:
    get:
      operationId: getPlayerById
      tags: [players]
      summary: Get player details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
        "404":
          description: Not found

  /matches/current:
    get:
      operationId: getCurrentMatches
      tags: [matches]
      summary: Get current round matches
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"

  /availability/current:
    get:
      operationId: getCurrentAvailability
      tags: [availability]
      summary: Get current player availability
      parameters:
        - name: round
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Availability list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /lineup/generate:
    post:
      operationId: generateLineup
      tags: [lineup]
      summary: Generate a lineup suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupGenerateRequest"
      responses:
        "401":
          description: Google login is required by the anonymous lineup policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupAccessError"
        "200":
          description: Generated lineup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupGenerateResponse"
        "402":
          description: Free-plan lock/exclusion or strategy limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequiredError"
        "409":
          description: Antimassa is in calibration because popularity data is unavailable or insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularityUnavailableError"
        "422":
          description: Locked/excluded lineup is not feasible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupValidationError"
        "500":
          description: Generation failed

  /lineup/compare-formations:
    post:
      operationId: compareFormations
      tags: [lineup]
      summary: Compare all formations without saving or consuming generation quota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupGenerateRequest"
      responses:
        "200":
          description: Ranked suggestions with per-formation infeasibility reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormationComparison"
        "400":
          description: Invalid input
        "402":
          description: Strategy or constraint limit requires Pro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequiredError"
        "422":
          description: Conflicting constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupValidationError"
        "409":
          description: Antimassa is in calibration because popularity data is unavailable or insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularityUnavailableError"
        "500":
          description: Operational failure

  /admin/sync/full:
    post:
      operationId: syncFull
      tags: [admin]
      summary: Trigger full ETL sync (all providers)
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          description: Sync already in progress

  /admin/sync/market:
    post:
      operationId: syncMarket
      tags: [admin]
      summary: Trigger market-only ETL sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          description: Sync already in progress

  /admin/sync/current-round:
    post:
      operationId: syncCurrentRound
      tags: [admin]
      summary: Trigger ETL sync for current round
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          description: Sync already in progress

  /admin/recalculate-projections:
    post:
      operationId: recalculateProjections
      tags: [admin]
      summary: Recalculate projections for current round
      responses:
        "200":
          description: Recalculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecalcResult"

  /admin/providers/status:
    get:
      operationId: getProvidersStatus
      tags: [admin]
      summary: Get status of all data providers
      responses:
        "200":
          description: Provider statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersStatusResponse"

  /admin/logs:
    get:
      operationId: getAdminLogs
      tags: [admin]
      summary: Get recent data collection logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Logs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogsResponse"

  /admin/projection-weights:
    get:
      operationId: getProjectionWeights
      tags: [admin]
      summary: Get current projection engine weights
      responses:
        "200":
          description: Projection weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionWeightsResponse"
    post:
      operationId: updateProjectionWeights
      tags: [admin]
      summary: Update projection engine weights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectionWeightsRequest"
      responses:
        "200":
          description: Updated weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionWeightsResponse"

  /lineup/{id}/save:
    post:
      operationId: saveLineup
      tags: [lineup]
      summary: Mark a lineup suggestion as saved/favourite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  schemas:
    HistoricalRepairStatus:
      type: object
      required: [progress]
      properties:
        progress:
          type: [object, "null"]
          properties:
            status:
              type: string
              enum: [running, completed, failed]
            startedAt:
              type: string
            finishedAt:
              type: string
            lastClosedRound:
              type: integer
            completedRounds:
              type: integer
            upserted:
              type: integer
            missingPlayers:
              type: integer
            error:
              type: string
            calibration:
              type: object
              additionalProperties: true
    PerformanceRound:
      type: object
      required: [round, mae, count]
      properties:
        round: { type: integer }
        mae: { type: number }
        count: { type: integer }
    PerformanceAggregate:
      type: object
      required: [empty, season, byRound, calibration, byPosition, meta]
      properties:
        empty: { type: boolean }
        message: { type: string }
        season:
          type: object
          required: [totalRounds, totalDataPoints, mae, overestimatedPct]
          properties:
            totalRounds: { type: integer }
            totalDataPoints: { type: integer }
            mae: { type: [number, "null"] }
            overestimatedPct: { type: [number, "null"] }
        byRound:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceRound"
        calibration:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceCalibrationBucket"
        byPosition:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PerformancePosition"
        differentials:
          type: object
          required: [total, hits, hitRate]
          properties:
            total: { type: integer }
            hits: { type: integer }
            hitRate: { type: number }
        traps:
          type: object
          required: [total, count, rate]
          properties:
            total: { type: integer }
            count: { type: integer }
            rate: { type: number }
        meta:
          type: object
          required: [generatedAt, disclaimer]
          properties:
            generatedAt: { type: string }
            disclaimer: { type: string }
    PerformancePosition:
      type: object
      required: [mae, count, overestimatedPct]
      properties:
        mae: { type: number }
        count: { type: integer }
        overestimatedPct: { type: number }
    PerformanceCalibrationBucket:
      type: object
      required: [label, bucket, avgProjected, avgActual, count]
      properties:
        label: { type: string }
        bucket: { type: string }
        avgProjected: { type: number }
        avgActual: { type: number }
        count: { type: integer }
    PerformanceStats:
      allOf:
        - $ref: "#/components/schemas/PerformanceAggregate"
        - type: object
          required: [popularityFeaturesEnabled, legacy]
          properties:
            popularityFeaturesEnabled: { type: boolean }
            legacy:
              allOf:
                - $ref: "#/components/schemas/PerformanceAggregate"
                - type: object
                  required: [disclaimer]
                  properties:
                    disclaimer: { type: string }
    BillingSubscription:
      type: object
      required: [plan, status, currentPeriodEnd, currentPeriodStart]
      properties:
        plan:
          type: string
        status:
          type: string
        currentPeriodEnd:
          type: [string, "null"]
          format: date-time
        currentPeriodStart:
          type: [string, "null"]
          format: date-time
          description: Recorded paid period start; null for unknown historical periods
    PlanSettings:
      type: object
      required: [seasonPassYear, seasonPassEndsAt, proMonthlyPrice, seasonPassPrice]
      properties:
        seasonPassYear:
          type: integer
          minimum: 2020
          maximum: 2100
        seasonPassEndsAt:
          type: string
          format: date-time
        proMonthlyPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        seasonPassPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        founderSeasonPassPrice:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
    BillingConfiguration:
      allOf:
        - $ref: "#/components/schemas/PlanSettings"
        - type: object
          required: [regularSeasonPassPrice, founderCutoff]
          properties:
            regularSeasonPassPrice:
              type: number
            founderCutoff:
              type: string
              format: date-time
    AdminConfiguration:
      allOf:
        - $ref: "#/components/schemas/PlanSettings"
        - type: object
          required: [xgStaleDays, freeLineupsPerRound, anonymousLineupMode]
          properties:
            freeLineupsPerRound:
              type: integer
              minimum: 0
              maximum: 1000
              default: 1
            anonymousLineupMode:
              type: string
              enum: [login_required, allowed]
              default: login_required
            xgStaleDays:
              type: integer
              minimum: 1
              maximum: 30
    AdminConfigurationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        freeLineupsPerRound:
          type: integer
          minimum: 0
          maximum: 1000
        anonymousLineupMode:
          type: string
          enum: [login_required, allowed]
        xgStaleDays:
          type: integer
          minimum: 1
          maximum: 30
        seasonPassYear:
          type: integer
          minimum: 2020
          maximum: 2100
        seasonPassEndsAt:
          type: string
          format: date-time
        proMonthlyPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        seasonPassPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
        founderSeasonPassPrice:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
    SyncStatus:
      type: object
      required: [lastSyncAt, isRunning, marketStatus, providersDegraded, lastMarketCheckAt, popularityFeaturesEnabled, popularity]
      properties:
        lastSyncAt:
          type: [string, "null"]
        isRunning:
          type: boolean
        marketStatus:
          type: [string, "null"]
        providersDegraded:
          type: boolean
        lastMarketCheckAt:
          type: [string, "null"]
          description: Last successful market check; null before the first observation
        popularityFeaturesEnabled:
          type: boolean
        popularity:
          type: object
          required: [lastCollectionAt, lastSuccessfulCollectionAt, coverage, minimumCoverage, maxAgeHours, reason]
          properties:
            lastCollectionAt:
              type: [string, "null"]
            lastSuccessfulCollectionAt:
              type: [string, "null"]
            coverage:
              type: integer
            minimumCoverage:
              type: integer
            maxAgeHours:
              type: integer
            reason:
              type: string
              enum: [ready, no_data, source_error, stale, insufficient_coverage, forced_failure, unavailable]
    FormationEvaluation:
      type: object
      required: [formation, feasible, expectedPoints, totalCost, balance, differenceFromBest, reason]
      properties:
        formation:
          type: string
        feasible:
          type: boolean
        expectedPoints:
          type: [number, "null"]
        totalCost:
          type: [number, "null"]
        balance:
          type: [number, "null"]
        differenceFromBest:
          type: [number, "null"]
        reason:
          type: [string, "null"]
    FormationComparison:
      type: object
      required: [round, strategy, budget, bestFormation, results]
      properties:
        round:
          type: integer
        strategy:
          type: string
        budget:
          type: number
        bestFormation:
          type: [string, "null"]
        results:
          type: array
          items:
            $ref: "#/components/schemas/FormationEvaluation"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RoundStatus:
      type: object
      properties:
        round:
          type: integer
        marketStatus:
          type: integer
        marketOpen:
          type: boolean
        closingTimestamp:
          type: integer
          nullable: true
        closingDate:
          type: string
          nullable: true
        timesEscalados:
          type: integer
        warning:
          type: string
      required:
        - round
        - marketStatus
        - marketOpen

    Club:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        abbreviation:
          type: string
          nullable: true
        badgeUrl:
          type: string
          nullable: true

    PlayerProjectionSummary:
      type: object
      properties:
        expectedPoints:
          type: number
          nullable: true
        floorPoints:
          type: number
          nullable: true
        ceilingPoints:
          type: number
          nullable: true
        riskScore:
          type: number
          nullable: true
        recommendationScore:
          type: number
          nullable: true
        valueScore:
          type: number
          nullable: true
        explanationJson:
          type: object
          nullable: true
          description: Basic explanation for everyone; Pro-only signals are omitted for Free and anonymous viewers.

    PlayerAvailabilitySummary:
      type: object
      properties:
        playProbability:
          type: number
          nullable: true
        expectedMinutes:
          type: number
          nullable: true
        riskScore:
          type: number
          nullable: true
        probableStatus:
          type: string
          nullable: true
        injuryStatus:
          type: string
          nullable: true
        suspensionStatus:
          type: string
          nullable: true

    Player:
      type: object
      properties:
        popularity:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Pro only. Known fraction of selected teams in the same round; omitted for Free and anonymous viewers.
        popularityCount:
          type: [integer, "null"]
          minimum: 0
          description: Pro only; omitted for Free and anonymous viewers.
        popularityListed:
          type: [boolean, "null"]
          description: Pro only; omitted for Free and anonymous viewers. False only when absent from a list covering this player's position.
        id:
          type: integer
        name:
          type: string
        nickname:
          type: string
          nullable: true
        position:
          type: string
        status:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        averagePoints:
          type: number
          nullable: true
        priceVariation:
          type: number
          nullable: true
          description: Price change from last round (variacao_num). Positive = player performed well.
        playedLastRound:
          type: boolean
          nullable: true
          description: Whether the player actually entered the field last round (entrou_em_campo).
        gamesPlayed:
          type: integer
          nullable: true
          description: Number of games played this season (jogos_num). Used for confidence scaling.
        minimoParaValorizar:
          type: number
          nullable: true
          description: Minimum points needed to increase price next round (minimo_para_valorizar from Cartola API).
        baseAverage:
          type: number
          nullable: true
          description: Average points excluding goal-event contributions (G×8, A×5, SG×5). Represents position-scout baseline.
        club:
          $ref: "#/components/schemas/Club"
          nullable: true
        projection:
          $ref: "#/components/schemas/PlayerProjectionSummary"
        availability:
          $ref: "#/components/schemas/PlayerAvailabilitySummary"
      required:
        - id
        - name
        - position

    PlayerListResponse:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        total:
          type: integer
      required:
        - players
        - total

    PlayerDetail:
      allOf:
        - $ref: "#/components/schemas/Player"
        - type: object
          properties:
            projections:
              type: array
              items:
                type: object

    ProjectionItem:
      type: object
      properties:
        explanationJson:
          type: [object, "null"]
          additionalProperties: true
          description: Plan-aware explanation. Pro-only signals are omitted for Free and anonymous viewers.
        id:
          type: integer
        playerId:
          type: integer
        round:
          type: integer
        expectedPoints:
          type: number
          nullable: true
        floorPoints:
          type: number
          nullable: true
        ceilingPoints:
          type: number
          nullable: true
        riskScore:
          type: number
          nullable: true
        recommendationScore:
          type: number
          nullable: true
        valueScore:
          type: number
          nullable: true
        player:
          type: object
          nullable: true

    ProjectionListResponse:
      type: object
      properties:
        limited:
          type: boolean
          description: True for Free and anonymous viewers; basic projections remain available.
        proTeaser:
          $ref: "#/components/schemas/ProjectionProTeaser"
        projections:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionItem"
        round:
          type: integer
      required:
        - projections
        - round
        - limited
        - proTeaser

    LineupAccessError:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
        reason:
          type: string
          enum: [login_required, pro_strategy, locked_limit, excluded_limit, round_quota]
        upgradeRequired:
          type: boolean

    ProjectionProTeaser:
      type: object
      required: [differentials, traps]
      properties:
        differentials:
          type: integer
          minimum: 0
        traps:
          type: integer
          minimum: 0

